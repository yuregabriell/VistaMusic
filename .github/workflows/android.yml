name: Build Android APK and publish GitHub Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: VistaMusic-main-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -path "*/bin/sdkmanager" -type f | sort -V | tail -1)
          echo "y" | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VistaMusic-v0.6.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VistaMusic-v0.6.0-debug
          path: VistaMusic-v0.6.0-debug.apk
          if-no-files-found: error
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          target_commitish: main
          name: VistaMusic v0.6.0 - Teste
          prerelease: true
          generate_release_notes: false
          body: |
            VistaMusic Android (versão experimental).
            YouTube Charts PT/US, 10 músicas no perfil do artista, géneros com páginas próprias, rádio enriquecida com músicas relacionadas no YouTube.
            APK assinado com chave debug do GitHub Actions, apenas para testes.
          files: VistaMusic-v0.6.0-debug.apk
          overwrite_files: true
